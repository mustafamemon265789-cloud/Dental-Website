services:
  - type: web
    name: dental-website
    env: python
    plan: free
    buildCommand: |
      cd backend && pip install -r requirements.txt
      cd admin-dashboard && npm install && npm run build
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./dental.db
