[phases.setup]
nixPkgs = ["python3", "nodejs", "python3Packages.pip"]

[phases.install]
cmds = [
    "cd backend && python3 -m pip install --user -r requirements.txt",
    "cd backend/admin-dashboard && npm install && npm run build"
]

[start]
cmd = "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
